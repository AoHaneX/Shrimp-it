[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shrimpit"
dynamic = ["version"]
description = "Compression, conversion et agrandissement locaux d’images"
readme = "README.md"
authors = [{ name = "AoHane" }]
# Code under MIT; artwork and sounds reserved (see LICENSE); bundled font under OFL.
license = "MIT AND LicenseRef-Shrimpit-Assets AND OFL-1.1"
license-files = ["LICENSE", "src/shrimpit/assets/licenses/*.txt"]
requires-python = ">=3.11"
# Essentials and Addons (QtMultimedia) only: the PySide6 meta-package also installs
# Qt WebEngine and Qt Pdf, about 300 MB that Shrimp'It never uses.
dependencies = ["Pillow>=13.0,<14", "PySide6-Essentials>=6.8,<7", "PySide6-Addons>=6.8,<7"]
keywords = ["image", "compression", "upscaling", "pillow", "pyside6", "pixel-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Homepage = "https://github.com/AoHaneX/Shrimp-it"
Repository = "https://github.com/AoHaneX/Shrimp-it"
Issues = "https://github.com/AoHaneX/Shrimp-it/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]
audit = ["bandit>=1.9,<2", "pip-audit>=2.10,<3"]

[project.gui-scripts]
shrimpit = "shrimpit.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "shrimpit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shrimpit = ["assets/backgrounds/*.png", "assets/branding/*.png", "assets/icons/*.png", "assets/icons/*.md", "assets/animations/*.gif", "assets/fonts/*.ttf", "assets/licenses/*.txt", "assets/sounds/*.ogg", "assets/examples/*.png", "assets/examples/*.jpg", "assets/examples/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.coverage.run]
source = ["shrimpit"]
branch = true

[tool.coverage.report]
show_missing = true
