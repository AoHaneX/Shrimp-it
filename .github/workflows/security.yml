name: Security audit

# Runs on a schedule rather than on every push: a vulnerability published in a dependency
# should be reported, not block unrelated changes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[audit]"
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m pip_audit --skip-editable --progress-spinner off
