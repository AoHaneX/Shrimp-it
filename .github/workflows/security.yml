name: Security audit

# Runs on a schedule rather than on every push: a vulnerability published in a dependency
# should be reported, not block unrelated changes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[audit]"
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m pip_audit --skip-editable --progress-spinner off
