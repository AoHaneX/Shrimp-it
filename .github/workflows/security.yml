name: Security audit

# Runs on a schedule rather than on every push: a vulnerability published in a dependency
# should be reported, not block unrelated changes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[audit]"
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m pip_audit --skip-editable --progress-spinner off
