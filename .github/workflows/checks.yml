name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The pip and setuptools bundled with older Python images can carry known vulnerabilities.
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,audit]"
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --cov=shrimpit --cov-report=term
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      # Tests run on the editable sources: install the wheel alone to catch missing package data.
      - name: Self-test the built wheel in a clean environment
        run: |
          python -m venv wheel-test
          wheel-test\Scripts\python.exe -m pip install (Get-ChildItem dist\*.whl).FullName
          wheel-test\Scripts\python.exe -m shrimpit --self-test
