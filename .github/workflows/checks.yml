name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The pip bundled with older Python images can carry known vulnerabilities reported by pip-audit.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,audit]"
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m pip_audit --skip-editable --progress-spinner off
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --cov=shrimpit --cov-report=term
      - run: python -m pip wheel --no-deps --wheel-dir dist .
