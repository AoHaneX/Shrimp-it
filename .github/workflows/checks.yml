name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      SHRIMPIT_REQUIRE_PNG_ENGINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The pip and setuptools bundled with older Python images can carry known vulnerabilities.
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,audit]"
      # Compile the bundled ExoQuant palette engine (MIT) so the tests and the wheel include it.
      - run: python -m pip install "ziglang==0.15.2"
      - run: python scripts/build_png_engine.py
      - run: python -m pip check
      - run: python -m bandit -r src -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q --cov=shrimpit --cov-report=term
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      # Tests run on the editable sources: install the wheel alone to catch missing package data.
      - name: Self-test the built wheel in a clean environment
        run: |
          python -m venv wheel-test
          wheel-test\Scripts\python.exe -m pip install (Get-ChildItem dist\*.whl).FullName
          wheel-test\Scripts\python.exe -m shrimpit --self-test
